# Auto-deploy av co-op-servern till Fly.io (warparty-eu, Stockholm) vid push
# som rör server/shared. Render auto-deployar parallellt tills den sägs upp —
# båda kör samma kod under övergången.
name: fly-deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "shared/**"
      - "Dockerfile"
      - "fly.toml"
      - "fly.us.toml"
      - "fly.asia.toml"
      - ".github/workflows/fly-deploy.yml"

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # app-scopade deploy-tokens (least privilege) — en secret per region
        include:
          - config: fly.toml
            token: FLY_API_TOKEN
          - config: fly.us.toml
            token: FLY_API_TOKEN_US
          - config: fly.asia.toml
            token: FLY_API_TOKEN_ASIA
    steps:
      - uses: actions/checkout@v4
      # pinnad version (granskning: @master = supply-chain-risk)
      - uses: superfly/flyctl-actions/setup-flyctl@v1
      - run: flyctl deploy -c ${{ matrix.config }} --remote-only --yes
        env:
          FLY_API_TOKEN: ${{ secrets[matrix.token] }}
