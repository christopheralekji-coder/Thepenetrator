# Asien-regionen (Tokyo/nrt — standardval för östasiatisk gaming; Sydostasien
# får ~70-90ms). AUTO-STOPP som USA: kostar bara när någon spelar där.
app = "warparty-asia"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  ACCOUNTS_DATA_DIR = "/data"

[[mounts]]
  source = "wp_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
