name: iOS → TestFlight

# Körs BARA manuellt (workflow_dispatch) eller på ios-tag, så den inte failar röd
# på varje vanlig push innan hemligheterna finns. Tryck "Run workflow" i GitHub
# Actions-fliken när Apple-kontot + secrets är på plats.
on:
  workflow_dispatch:
  push:
    tags:
      - "ios-v*"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Apple kräver bygge med Xcode 26 / iOS 26 SDK för App Store-uppladdning.
      - name: Välj senaste Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installera beroenden
        run: npm ci || npm install

      - name: Bygg www + iOS-projekt
        run: |
          npm run build:www
          npx cap add ios
          npx cap sync ios

      - name: Lås orientering till LANDSKAP (iOS Info.plist)
        run: |
          PB=/usr/libexec/PlistBuddy
          PLIST="ios/App/App/Info.plist"
          for KEY in "UISupportedInterfaceOrientations" "UISupportedInterfaceOrientations~ipad"; do
            $PB -c "Delete :$KEY" "$PLIST" 2>/dev/null || true
            $PB -c "Add :$KEY array" "$PLIST"
            $PB -c "Add :$KEY:0 string UIInterfaceOrientationLandscapeLeft" "$PLIST"
            $PB -c "Add :$KEY:1 string UIInterfaceOrientationLandscapeRight" "$PLIST"
          done
          # Helskärm (krävs för att iPad ska få vara landskap-bara, annars multitask-krav).
          $PB -c "Delete :UIRequiresFullScreen" "$PLIST" 2>/dev/null || true
          $PB -c "Add :UIRequiresFullScreen bool true" "$PLIST"
          # Export Compliance: appen använder ingen icke-undantagen kryptering (bara HTTPS)
          # → Apple hoppar krypterings-frågan → bygget blir direkt testbart i TestFlight.
          $PB -c "Delete :ITSAppUsesNonExemptEncryption" "$PLIST" 2>/dev/null || true
          $PB -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST"
          echo "Orientering + helskärm + compliance satt"

      - name: Tvinga LANDSKAP i AppDelegate (runtime-auktoritet, överstyr Info.plist)
        run: |
          AD="ios/App/App/AppDelegate.swift"
          if grep -q "supportedInterfaceOrientationsFor" "$AD"; then
            echo "AppDelegate redan patchad"
          else
            perl -0pi -e 's/(var window: UIWindow\?)/$1\n\n    func application(_ application: UIApplication, supportedInterfaceOrientationsFor window: UIWindow?) -> UIInterfaceOrientationMask {\n        return .landscape\n    }/' "$AD"
            echo "AppDelegate patchad med .landscape"
          fi
          grep -n "supportedInterfaceOrientationsFor\|\.landscape" "$AD" || true

      - name: Generera app-ikoner + splash
        run: npx @capacitor/assets generate --ios --assetPath resources || echo "assets-generering hoppad"

      - name: Ruby + Fastlane (via Bundler — löser alla gem-beroenden)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: SSH-åtkomst till privat cert-repo (match)
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.MATCH_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null

      - name: Bygg + ladda upp till TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APP_ID: com.warparty.game
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}
          FASTLANE_HIDE_CHANGELOG: "true"
        run: bundle exec fastlane beta

      - name: Spara .ipa som artifact (om bygget lyckas)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WarParty-ipa
          path: build/*.ipa
          if-no-files-found: ignore
