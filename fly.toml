# Fly.io-konfig: WarParty co-op-server, region Stockholm (arn).
# EU-primären är ALLTID PÅ (min_machines_running=1, auto_stop off) — spelservern
# ska aldrig kallstarta mitt i en sessions-start. Framtida extra regioner (USA/
# Asien) kan köra auto-stop för att bara kosta när någon spelar där.
app = "warparty-eu"
primary_region = "arn"

[build]
  dockerfile = "Dockerfile"

[env]
  ACCOUNTS_DATA_DIR = "/data"
  # UDP-transport (V2-native): Fly KRÄVER bind till fly-global-services för UDP.
  UDP_BIND = "fly-global-services"
  # AUDIT C175: dev-konto-id(n) som får trigga cheats (komma-separerat). Ej hemligt
  # (bara ett konto-id; cheaten gatas server-side mot detta). Lägg till fler vid behov.
  DEV_ACCOUNT_IDS = "86743226"
  # SERVER-AUKTORITATIV XP (fas 1): "1" = BARA dev-konton (DEV_ACCOUNT_IDS) blir server-auth
  # för PvP-XP (test). "all" = alla spelare. Osatt = av (klient-auth). Aktiverad 2026-06-19
  # för dev-test på EU. Bredda till "all" + us/asia när verifierad.
  SERVERAUTH_XP = "1"

[[mounts]]
  source = "wp_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

# UDP-transport (V2-native, V1 dött) — samma internal_port som HTTP/WS (8080), eget
# protokoll-namespace. KRÄVER en dedikerad IPv4 (fly ips allocate-v4) — UDP funkar EJ
# på delad/anycast-IP. Appen binder UDP till fly-global-services:8080 (UDP_BIND-env).
[[services]]
  protocol = "udp"
  internal_port = 8080

  [[services.ports]]
    port = 8080

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
