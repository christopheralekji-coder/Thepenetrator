name: iOS V2 → TestFlight (Godot)

# Bygger WARPARTY V2 (Godot-repot warparty-v2) härifrån V1-repot — för att
# återanvända ALLA befintliga secrets (ASC_*, APPLE_TEAM_ID, MATCH_*) utan
# kopiering. V2-koden checkas ut via read-only deploy-nyckel (V2_DEPLOY_KEY).
# Körs BARA manuellt. V2-repots egen ios-testflight.yml är samma pipeline för
# framtiden om secrets flyttas dit.
on:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.6.3"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checka ut V2-repot via deploy-nyckel
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.V2_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git clone --depth 1 git@github.com:christopheralekji-coder/warparty-v2.git v2

      # GodotApplePlugins (migueldeicaza) — Sign in with Apple + Game Center.
      # GDExtension med iOS-xcframeworks; binärerna är för stora för repot
      # (~110 MB opackat) → pinnad release-zip + sha256 i stället. Endast de
      # tre addons vi behöver packas upp (Runtime är delat beroende som
      # .gdextension-manifesten pekar på — Godot bäddar in xcframeworken i
      # Xcode-projektet vid export, även med export_project_only=true).
      - name: Installera GodotApplePlugins (pinnad version + checksum)
        run: |
          set -e
          cd v2
          GAP_BUILD="22a254b8866e5a75e234621b09da3d8a14f143a9"   # release 2026-06-07
          GAP_SHA256="d9daf99f75ad12d46ee879fd0c54d8b40539e3d2fd963b38f2d2e78f6fa11809"
          curl -L -o gap.zip "https://github.com/migueldeicaza/GodotApplePlugins/releases/download/build-${GAP_BUILD}/GodotApplePlugins-addons-${GAP_BUILD}.zip"
          echo "${GAP_SHA256}  gap.zip" | shasum -a 256 -c -
          unzip -q gap.zip -d gap_tmp \
            "dist/addons/GodotApplePluginsRuntime/*" \
            "dist/addons/GodotApplePluginsAuthenticationServices/*" \
            "dist/addons/GodotApplePluginsGameCenter/*"
          mkdir -p addons
          cp -R gap_tmp/dist/addons/* addons/
          rm -rf gap.zip gap_tmp
          ls addons/

      - name: Välj senaste Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Ladda ner Godot + iOS-exportmallar
        run: |
          set -e
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -L -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          unzip -q godot.zip
          GODOT="$PWD/Godot.app/Contents/MacOS/Godot"
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"
          curl -L -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          TPL_DIR="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TPL_DIR"
          unzip -q templates.tpz
          mv templates/* "$TPL_DIR/"
          "$GODOT" --version

      - name: Importera + exportera iOS-Xcode-projekt
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -e
          cd v2
          # Godot kräver app_store_team_id även med export_project_only —
          # injiceras från secreten här så det aldrig ligger i repot.
          sed -i '' "s|application/app_store_team_id=\"\"|application/app_store_team_id=\"$TEAM_ID\"|" export_presets.cfg
          grep -c "app_store_team_id" export_presets.cfg
          "$GODOT" --headless --path . --import || true
          mkdir -p build/ios
          "$GODOT" --headless --path . --export-release "iOS" "build/ios/WarParty.ipa"
          ls -la build/ios/
          test -d build/ios/WarParty.xcodeproj || { echo "::error::Xcode-projektet genererades inte"; exit 1; }
          # Sanity: plugin-ramverken MÅSTE ha följt med i exporten — annars är
          # Apple-knappen död i appen igen (unavailable) trots grönt bygge.
          find build/ios -name "*.xcframework" -prune | sort
          find build/ios -name "*SwiftGodotRuntime*" -prune | grep -q . \
            || { echo "::error::GodotApplePlugins-ramverken kom inte med i iOS-exporten"; exit 1; }
          # Sanity: SiwA-entitlementen måste ligga i .entitlements-filen
          find build/ios -name "*.entitlements" -exec cat {} \;
          find build/ios -name "*.entitlements" -exec cat {} \; | grep -q "applesignin" \
            || { echo "::error::com.apple.developer.applesignin saknas i entitlements"; exit 1; }

      - name: Ruby + Fastlane (Bundler mot V2:s Gemfile)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: v2

      - name: Byt SSH-nyckel till match-repots deploy-nyckel
        run: |
          printf '%s\n' "${{ secrets.MATCH_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Bygg + ladda upp till TestFlight
        working-directory: v2
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APP_ID: com.warparty.game
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}
          FASTLANE_HIDE_CHANGELOG: "true"
        run: bundle exec fastlane beta

      - name: Spara .ipa som artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WarParty-V2-ipa
          path: v2/build/*.ipa
          if-no-files-found: ignore
